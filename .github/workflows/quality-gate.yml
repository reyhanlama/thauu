name: MapThis quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run automated tests
        run: node --test test/*.test.mjs
      - name: Check patch whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check origin/${{ github.base_ref }}...HEAD
      - name: Check pushed commit whitespace
        if: github.event_name == 'push'
        run: git diff --check HEAD^...HEAD
      - name: Check JavaScript syntax
        run: |
          node --check webui/app.js
          node --check webui/project-state.js
          node --check webui/map-geometry.js
          node --check netlify/functions/search.mjs
          node --check netlify/functions/map-data.mjs
